# zer0arc4 Theme Parameters

description = 'Documenting my journey through cybersecurity, penetration testing, CTFs, research, and tool development.'
author = 'zer0arc4'
tagline = 'Documenting my journey through cybersecurity, penetration testing, CTFs, research, and tool development.'

# Branding
[brand]
  name = 'zer0arc4'
  title = 'Cybersecurity Student | Penetration Testing & Red Teaming Enthusiast'
  logo = '/images/logo.svg'

# Social
[social]
  github = 'https://github.com/zer0arc4'
  linkedin = 'https://linkedin.com/in/alakati-rithesh-chandra'
  email = 'iamzer0arc4@gmail.com'

# Analytics — Plausible (privacy-friendly)
[analytics]
  enabled = true
  provider = 'plausible'
  domain = 'zer0arc4.github.io'

# Comments — Giscus
[comments]
  enabled = true
  provider = 'giscus'
  repo = 'zer0arc4/zer0arc4.github.io'
  repoId = 'R_kgDOS0PC0Q'
  category = 'Comments'
  categoryId = 'DIC_kwDOS0PC0c4C-vfD'
  mapping = 'pathname'
  theme = 'noborder_dark'
  lang = 'en'
  reactions = true
  writeups_default = false
  notes_default = true

# Search — Pagefind
[search]
  enabled = true
  provider = 'pagefind'

# SEO
[seo]
  twitter_card = 'summary_large_image'
  og_image = '/images/og/default.svg'
  google_site_verification = 'mfVDDGTzy77apV5OY-Qfb-7nYn0cilbezliN7ppYHOA'

# Features
[features]
  terminal = false
  stats = true
  skills_matrix = false
  timeline = true
  reading_time = true
  related_posts = true
  author_box = true
  breadcrumbs = true
  newsletter = false

# Homepage section order
[homepage]
  sections = [
    'hero',
    'featured_writeups',
    'featured_projects',
    'stats',
    'activity_timeline',
    'contact_cta',
  ]

# Difficulty colors
[difficulty]
  low = 'hsl(212, 71%, 45%)'
  easy = '#22C55E'
  medium = '#FF8C00'
  hard = '#EF4444'
  insane = '#A855F7'
  beginner = '#22C55E'
  intermediate = '#FF8C00'
  advanced = '#EF4444'
