<section class="py-16 bg-ember-bg-secondary">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="section-title">Skills Matrix</h2>
    <p class="section-subtitle">Technical proficiencies across security domains and tooling</p>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      {{ range hugo.Data.skills.categories }}
      <div class="ember-card p-6">
        <h3 class="text-text-primary font-semibold mb-4 text-lg">{{ .name }}</h3>
        <div class="space-y-4">
          {{ range .skills }}
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-text-secondary">{{ .name }}</span>
              <span class="text-ember-soft font-mono">{{ .level }}%</span>
            </div>
            <div class="skill-bar-track">
              <div class="skill-bar-fill" style="width: {{ .level }}%"></div>
            </div>
          </div>
          {{ end }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
