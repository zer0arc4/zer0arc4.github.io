<section class="relative overflow-hidden py-20 md:py-28">
  <div class="absolute inset-0 bg-gradient-to-br from-ember-primary/5 via-transparent to-ember-secondary/5"></div>
  <div class="absolute top-1/4 -right-32 w-96 h-96 bg-ember-primary/10 rounded-full blur-3xl"></div>
  <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-ember-secondary/10 rounded-full blur-3xl"></div>

  <div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="flex justify-center mb-8 animate-fade-in">
      <div class="relative">
        <div class="absolute inset-0 bg-gradient-primary rounded-2xl blur-2xl opacity-20"></div>
        <img
          src="{{ .Site.Params.brand.logo | default "/images/logo.svg" }}"
          alt="{{ .Site.Params.brand.name }}"
          class="relative w-28 h-28 md:w-36 md:h-36 rounded-2xl object-cover border-2 border-ember-border glow-border"
          width="144"
          height="144"
          loading="eager"
        >
      </div>
    </div>

    <div class="animate-slide-up">
      <p class="text-ember-primary font-mono text-sm mb-4 tracking-wider uppercase">// Cybersecurity Portfolio</p>
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-text-primary leading-tight mb-4">
        {{ .Site.Params.brand.name }}
      </h1>
      <p class="text-lg md:text-xl text-ember-soft font-medium mb-6">
        {{ .Site.Params.brand.title }}
      </p>
      <p class="text-text-secondary text-lg leading-relaxed mb-8 max-w-2xl mx-auto">
        {{ hugo.Data.site.intro | markdownify }}
      </p>
      <div class="flex flex-wrap justify-center gap-4">
        <a href="{{ .Site.Params.social.github }}" target="_blank" rel="noopener noreferrer" class="btn-primary">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
        <a href="{{ .Site.Params.social.linkedin }}" target="_blank" rel="noopener noreferrer" class="btn-ghost">
          LinkedIn
        </a>
        <a href="{{ "/contact/" | relURL }}" class="btn-ghost">Contact</a>
      </div>
    </div>
  </div>
</section>
