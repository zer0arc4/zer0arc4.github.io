<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ (.Site.Params.brand.name | default .Site.Title) | jsonify }},
  "alternateName": "zer0arc4",
  "jobTitle": {{ .Site.Params.brand.title | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }},
  "email": {{ hugo.Data.site.email | jsonify }},
  "image": {{ (.Site.Params.brand.logo | default "/images/logo.svg") | absURL | jsonify }},
  "sameAs": [
    {{ .Site.Params.social.github | jsonify }},
    {{ .Site.Params.social.linkedin | jsonify }}
  ],
  "knowsAbout": ["Cybersecurity", "Penetration Testing", "Red Teaming", "CTF"]
}
</script>
